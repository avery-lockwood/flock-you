[platformio]
src_dir = .

[env:xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

build_src_filter = +<main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; Classic ESP32 (ESP32-D0WD, 4MB flash) dev board with 0.96" 128x64 SSD1306
; OLED at 0x3C — SDA=GPIO21, SCL=GPIO22, USB-serial (not native USB).
[env:esp32_oled096]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_ESP32_OLED096
    -DUSE_OLED_DISPLAY
    -DUSE_BLE_COMPANION

build_src_filter = +<main.cpp> +<display_oled.cpp> +<ble_companion.cpp>

lib_deps =
    olikraus/U8g2@^2.36.15
    h2zero/NimBLE-Arduino@^1.4.0

board_build.partitions = partitions_4mb.csv
board_build.filesystem = spiffs

; 01Space-style ESP32-C3 board (4MB flash) with 0.42" 72x40 SSD1306 OLED
; at 0x3C — SDA=GPIO5, SCL=GPIO6, native USB.
[env:xiao_esp32c3_oled042]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_XIAO_ESP32C3_OLED
    -DUSE_OLED_DISPLAY
    -DOLED_72X40
    -DOLED_SDA_PIN=5
    -DOLED_SCL_PIN=6

build_src_filter = +<main.cpp> +<display_oled.cpp>

lib_deps = olikraus/U8g2@^2.36.15

board_build.partitions = partitions_4mb.csv
board_build.filesystem = spiffs
